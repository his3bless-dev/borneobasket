<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BorneoBasket — Your Harvest, Our Wheels, Zero Hassle</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f8f4;color:#17382b}
:root{--g:#0d513b;--g2:#287654;--light:#eaf4ed;--cream:#fffdf7;--line:#dce7df;--muted:#6d7e75;--orange:#e39a4c}
button,input,select,textarea{font:inherit}button{cursor:pointer}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}
.logo{display:flex;gap:10px;align-items:center;font-size:21px;font-weight:900;color:var(--g)}.mark{width:40px;height:40px;background:var(--g);border-radius:13px;display:grid;place-items:center;color:#fff}.logo small{display:block;font-size:9px;color:var(--muted);letter-spacing:.6px}
.lang{display:flex;background:#edf3ef;padding:4px;border-radius:11px}.lang button{border:0;background:transparent;border-radius:8px;padding:7px 11px;font-weight:800;color:var(--muted)}.lang .on{background:#fff;color:var(--g);box-shadow:0 2px 7px #0001}
.container{max-width:1160px;margin:auto;padding:28px 18px 60px}.login{max-width:1160px;min-height:calc(100vh - 72px);margin:auto;padding:35px 18px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.heroLogin{min-height:560px;border-radius:32px;padding:45px;color:white;background:linear-gradient(140deg,#093b2b,#1d684a);position:relative;overflow:hidden;box-shadow:0 25px 70px #0d513b22}.heroLogin:before,.heroLogin:after{content:"";position:absolute;border-radius:50%;background:#ffffff0c}.heroLogin:before{width:420px;height:420px;right:-180px;top:-180px}.heroLogin:after{width:360px;height:360px;left:-200px;bottom:-200px}.ey{font-size:11px;font-weight:900;letter-spacing:2px;color:#bfe1cc}.heroLogin h1{font-size:58px;line-height:.98;letter-spacing:-2px;max-width:650px;margin:28px 0 16px}.heroLogin p{font-size:16px;line-height:1.7;color:#d9eee1;max-width:580px}.slogan{display:inline-block;margin-top:25px;padding:12px 15px;border-radius:999px;border:1px solid #ffffff35;background:#ffffff12;font-size:11px;font-weight:900;letter-spacing:1.2px}.food{position:absolute;right:50px;bottom:35px;font-size:90px;transform:rotate(-4deg)}
.card{background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:0 18px 55px #0d513b12}.loginCard{padding:34px}.loginCard h2{font-size:29px;margin:8px 0}.muted{color:var(--muted);font-size:13px;line-height:1.6}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:7px}.field input,.field select,.field textarea,.search{width:100%;padding:13px 14px;border:1px solid #d5e0d9;border-radius:12px;background:#fbfdfb;outline:none}.field textarea{min-height:90px;resize:vertical}.btn{border:0;border-radius:12px;padding:12px 15px;font-weight:900}.primary{background:var(--g);color:white}.secondary{background:var(--light);color:var(--g)}.outline{background:#fff;border:1px solid var(--line);color:var(--g)}.danger{background:#fff0ef;color:#a3403b}.wide{width:100%}.notice{background:#fff5df;border:1px solid #efdcb3;color:#785c28;padding:12px;border-radius:13px;font-size:12px;margin:16px 0}.switch{display:flex;gap:8px;margin-top:9px}.switch>*{flex:1}
.nav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.nav button{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;color:#607169}.nav .active{background:var(--g);color:#fff;border-color:var(--g)}.nav .logout{margin-left:auto}
.hero{padding:30px;border-radius:27px;background:linear-gradient(135deg,#e9f4ec,#fffdf7);border:1px solid #dbe8df;margin-bottom:16px;position:relative;overflow:hidden}.hero h1{font-size:38px;margin:8px 0}.hero:after{content:"🌾";position:absolute;right:25px;bottom:-35px;font-size:120px;opacity:.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:19px;padding:18px}.num{font-size:29px;font-weight:900;margin-top:7px}.content{padding:23px}.content h2{margin:0 0 5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 15px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}.list{display:grid;gap:11px;margin-top:14px}.item{display:grid;grid-template-columns:78px 1fr auto;gap:13px;border:1px solid var(--line);border-radius:16px;padding:12px;background:#fff}.photo{width:78px;height:70px;border-radius:12px;background:#edf3ee;display:grid;place-items:center;font-size:29px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.item h3{font-size:15px;margin:2px 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.65}.badge{display:inline-block;white-space:nowrap;padding:6px 9px;border-radius:999px;background:#eaf4ed;color:#226747;font-size:11px;font-weight:900}.badge.new{background:#fff1d5;color:#815f21}.badge.red{background:#ffeded;color:#9e3c38}.toolbar{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px}.toolbar>div{flex:1}.empty{text-align:center;color:var(--muted);padding:30px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.quick div{background:#ffffffbb;border:1px solid #dbe8df;border-radius:16px;padding:13px;font-size:12px}.quick strong{display:block;margin-bottom:4px}.tag{display:inline-block;padding:7px 10px;border-radius:999px;background:#0d513b0d;color:var(--g);font-size:11px;font-weight:900}
@media(max-width:820px){.login{grid-template-columns:1fr}.heroLogin{min-height:430px;padding:30px}.heroLogin h1{font-size:44px}.food{font-size:65px;right:20px}.stats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.full{grid-column:auto}.quick{grid-template-columns:1fr}.nav .logout{margin-left:0}.item{grid-template-columns:65px 1fr}.photo{width:65px;height:65px}.item>.badge{grid-column:2}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";
var lang="ms", role="farmer", user=null, page="dashboard";
var farmers=[
 {email:"farmer@demo.com",name:"Ahmad bin Hassan",phone:"012-345 6789",location:"Sarawak"},
 {email:"sri@example.com",name:"Sri Aishah",phone:"013-222 1144",location:"Sarawak"},
 {email:"jambal@example.com",name:"Jambal bin Ismail",phone:"014-778 9012",location:"Sarawak"}
];
var products=[
 {id:1,farmerEmail:"farmer@demo.com",farmerName:"Ahmad bin Hassan",phone:"012-345 6789",product:"Cili",category:"Sayuran",qty:"50",unit:"kg",price:"8",harvest:"2026-09-20",location:"Sarawak",status:"New",purchasePrice:""},
 {id:2,farmerEmail:"sri@example.com",farmerName:"Sri Aishah",phone:"013-222 1144",product:"Nanas",category:"Buah-buahan",qty:"100",unit:"pcs",price:"6",harvest:"2026-09-18",location:"Sarawak",status:"Contacted",purchasePrice:"4",collectionDate:"2026-09-21"},
 {id:3,farmerEmail:"jambal@example.com",farmerName:"Jambal bin Ismail",phone:"014-778 9012",product:"Sayur Campur",category:"Sayuran",qty:"30",unit:"kg",price:"6",harvest:"2026-09-15",location:"Sarawak",status:"Collection Arranged",purchasePrice:"5",collectionDate:"2026-09-22"},
 {id:4,farmerEmail:"farmer@demo.com",farmerName:"Ahmad bin Hassan",phone:"012-345 6789",product:"Ubi Kayu",category:"Hasil Tani Lain",qty:"200",unit:"kg",price:"3",harvest:"2026-09-12",location:"Sarawak",status:"Completed",purchasePrice:"2.5",collectionDate:"2026-09-14"}
];
var statusBM={New:"Baharu",Contacted:"Sudah Dihubungi","Collection Arranged":"Kutipan Dijadualkan",Collected:"Sudah Dikumpul",Completed:"Selesai",Rejected:"Ditolak"};
var statusEN={New:"New",Contacted:"Contacted","Collection Arranged":"Collection Arranged",Collected:"Collected",Completed:"Completed",Rejected:"Rejected"};
function T(ms,en){return lang==="ms"?ms:en}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function save(){try{localStorage.setItem("bbDemoState",JSON.stringify({farmers:farmers,products:products,lang:lang}))}catch(e){}}
function load(){try{var x=JSON.parse(localStorage.getItem("bbDemoState"));if(x){if(Array.isArray(x.farmers))farmers=x.farmers;if(Array.isArray(x.products))products=x.products;if(x.lang)lang=x.lang}}catch(e){}}
function header(){return '<header class="top"><div class="logo"><span class="mark">🌿</span><div>BorneoBasket<small>'+T("Hasil tani Sarawak, dari petani kepada pasaran","Sarawak produce, from farmers to market")+'</small></div></div><div class="lang"><button class="'+(lang==="ms"?"on":"")+'" onclick="BB.lang(\'ms\')">BM</button><button class="'+(lang==="en"?"on":"")+'" onclick="BB.lang(\'en\')">EN</button></div></header>'}
function login(){return header()+'<main class="login"><section class="heroLogin"><div class="ey">SARAWAK • FARMERS • PRODUCE</div><h1>From your farm<br>to a better market.</h1><p>'+T("Membantu petani pedalaman Sarawak mencari jalan untuk menjual hasil tani mereka.","Helping rural Sarawak farmers find a way to sell their agricultural produce.")+'</p><div class="slogan">YOUR HARVEST, OUR WHEELS, ZERO HASSLE</div><div class="food">🥬🍍</div></section><section class="card loginCard"><span class="tag">BORNEOBASKET</span><h2>'+T(role==="admin"?"Pengurus BorneoBasket · Log Masuk":"Petani · Log Masuk",role==="admin"?"BorneoBasket Operator · Log In":"Farmer · Log In")+'</h2><p class="muted">'+T("Prototaip tugasan. Gunakan akaun demo.","Assignment prototype. Use the demo account.")+'</p><div class="notice">'+T(role==="admin"?"Demo Pengurus: admin@borneo.com / admin123":"Demo Petani: farmer@demo.com / 123456",role==="admin"?"Operator demo: admin@borneo.com / admin123":"Farmer demo: farmer@demo.com / 123456")+'</div><form onsubmit="BB.login(event)"><div class="field"><label>Email</label><input id="email" type="email" value="'+(role==="admin"?"admin@borneo.com":"farmer@demo.com")+'" required></div><div class="field"><label>'+T("Kata Laluan","Password")+'</label><input id="password" type="password" value="'+(role==="admin"?"admin123":"123456")+'" required></div><button class="btn primary wide">'+T("Log Masuk","Log In")+'</button></form><div class="switch"><button class="btn outline" onclick="BB.role()">'+T(role==="admin"?"Log masuk sebagai Petani":"Log masuk sebagai Pengurus",role==="admin"?"Login as Farmer":"Login as Operator")+'</button></div><div style="margin-top:10px"><button class="btn secondary wide" onclick="BB.reset()">'+T("Reset Demo","Reset Demo Data")+'</button></div></section></main>'}
function nav(){return '<nav class="nav"><button class="'+(page==="dashboard"?"active":"")+'" onclick="BB.page(\'dashboard\')">⌂ '+T("Papan Pemuka","Dashboard")+'</button><button class="'+(page==="submit"?"active":"")+'" onclick="BB.page(\'submit\')">＋ '+T("Hantar Hasil","Submit Produce")+'</button><button class="'+(page==="mine"?"active":"")+'" onclick="BB.page(\'mine\')">▣ '+T("Hasil Saya","My Produce")+'</button><button class="'+(page==="profile"?"active":"")+'" onclick="BB.page(\'profile\')">◯ '+T("Profil Saya","My Profile")+'</button><button class="btn secondary logout" onclick="BB.logout()">'+T("Log Keluar","Log Out")+'</button></nav>'}
function status(s){var label=(lang==="ms"?statusBM:statusEN)[s]||s;return '<span class="badge '+(s==="New"?"new":s==="Rejected"?"red":"")+'">'+label+'</span>'}
function farmer(){var f=farmers.filter(function(x){return x.email===user})[0]||{name:user,phone:"",location:""};var mine=products.filter(function(p){return p.farmerEmail===user});var body=page==="submit"?submit(f):page==="mine"?minePage(mine):page==="profile"?profile(f):dash(f,mine);return header()+'<main class="container">'+nav()+body+'</main>'}
function dash(f,mine){return '<section class="hero"><span class="tag">YOUR HARVEST, OUR WHEELS, ZERO HASSLE</span><h1>'+T("Selamat datang","Welcome")+', '+esc(f.name)+' 👋</h1><p class="muted">'+T("Hantar hasil tani anda dan BorneoBasket akan menyemak, menghubungi dan mengurus kutipan.","Submit your produce and BorneoBasket will review, contact you and manage collection.")+'</p><button class="btn primary" onclick="BB.page(\'submit\')">＋ '+T("Saya Ada Hasil Untuk Dijual","I Have Produce to Sell")+'</button><div class="quick"><div><strong>🌱 '+T("Hantar Hasil","Submit Produce")+'</strong><span class="muted">'+T("Masukkan gambar, kuantiti, harga dan lokasi.","Add photo, quantity, price and location.")+'</span></div><div><strong>📦 '+T("Hasil Saya","My Produce")+'</strong><span class="muted">'+mine.length+" "+T("rekod","records")+'</span></div><div><strong>🚚 '+T("Selesai","Completed")+'</strong><span class="muted">'+mine.filter(function(p){return p.status==="Completed"}).length+" "+T("kutipan","collections")+'</span></div></div></section><section class="stats"><div class="stat"><div class="muted">'+T("Hasil Saya","My Produce")+'</div><div class="num">'+mine.length+'</div></div><div class="stat"><div class="muted">'+T("Sedang Diproses","In Progress")+'</div><div class="num">'+mine.filter(function(p){return ["New","Contacted","Collection Arranged","Collected"].indexOf(p.status)>=0}).length+'</div></div><div class="stat"><div class="muted">'+T("Selesai","Completed")+'</div><div class="num">'+mine.filter(function(p){return p.status==="Completed"}).length+'</div></div></section><section class="card content"><div class="toolbar"><div><h2>'+T("Hasil Terkini","Recent Produce")+'</h2><span class="muted">'+T("Pantau status hasil anda.","Track your produce status.")+'</span></div><button class="btn secondary" onclick="BB.page(\'submit\')">＋ '+T("Hantar","Submit")+'</button></div><div class="list">'+(mine.slice(0,5).map(item).join("")||'<div class="empty">'+T("Tiada rekod lagi.","No records yet.")+'</div>')+'</div></section>'}
function icon(p){if(p.category==="Buah-buahan")return "🍍";if(p.category==="Sayuran")return "🥬";if(p.category==="Telur")return "🥚";if(p.category==="Daging Segar")return "🥩";return "🌾"}
function item(p){return '<div class="item"><div class="photo">'+icon(p)+'</div><div><h3>'+esc(p.product)+'</h3><div class="meta">'+esc(p.category)+' · '+esc(p.qty)+' '+esc(p.unit)+' · RM '+Number(p.price||0).toFixed(2)+'/'+esc(p.unit)+'</div><div class="meta">📍 '+esc(p.location)+' · 📅 '+esc(p.harvest)+'</div></div>'+status(p.status)+'</div>'}
function submit(f){return '<section class="card content"><span class="tag">'+T("Hantar Hasil","Submit Produce")+'</span><h2 style="margin-top:9px">'+T("Saya Ada Hasil Untuk Dijual","I Have Produce to Sell")+'</h2><p class="muted">'+T("Beritahu kami apa yang anda ada. BorneoBasket akan menghubungi anda untuk urusan pembelian dan kutipan.","Tell us what you have. BorneoBasket will contact you about purchase and collection.")+'</p><form class="grid2" onsubmit="BB.add(event)"><div class="field"><label>'+T("Nama Hasil","Produce Name")+' *</label><input id="product" required></div><div class="field"><label>'+T("Kategori","Category")+' *</label><select id="category" required><option value="">'+T("Pilih","Choose")+'</option><option>Sayuran</option><option>Buah-buahan</option><option>Daging Segar</option><option>Telur</option><option>Hasil Tani Lain</option></select></div><div class="field"><label>'+T("Kuantiti","Quantity")+' *</label><input id="qty" type="number" min="0.01" step="0.01" required></div><div class="field"><label>'+T("Unit","Unit")+' *</label><select id="unit"><option>kg</option><option>pcs</option><option>tray</option><option>basket</option><option>bag</option></select></div><div class="field"><label>'+T("Harga Diminta","Asking Price")+' (RM) *</label><input id="price" type="number" min="0" step="0.01" required></div><div class="field"><label>'+T("Tarikh Tuai","Harvest Date")+' *</label><input id="harvest" type="date" required></div><div class="field full"><label>'+T("Lokasi","Location")+' *</label><input id="location" value="'+esc(f.location||"")+'" placeholder="Sarawak" required></div><div class="field full"><label>'+T("Gambar Hasil","Produce Photo")+' *</label><input id="photo" type="file" accept="image/*" required></div><div class="field full"><label>'+T("Penerangan","Description")+'</label><textarea id="desc"></textarea></div><div class="full actions"><button type="button" class="btn outline" onclick="BB.page(\'dashboard\')">'+T("Batal","Cancel")+'</button><button class="btn primary">'+T("Hantar Maklumat","Submit Details")+'</button></div></form></section>'}
function minePage(mine){return '<section class="card content"><h2>'+T("Hasil Saya","My Produce")+'</h2><p class="muted">'+T("Semua hasil yang anda hantar kepada BorneoBasket.","All produce submissions sent to BorneoBasket.")+'</p><div class="list">'+(mine.map(item).join("")||'<div class="empty">'+T("Tiada rekod lagi.","No records yet.")+'</div>')+'</div></section>'}
function profile(f){return '<section class="card content"><h2>'+T("Profil Saya","My Profile")+'</h2><form class="grid2" onsubmit="BB.profile(event)"><div class="field full"><label>'+T("Nama Penuh","Full Name")+'</label><input id="pname" value="'+esc(f.name)+'" required></div><div class="field"><label>'+T("No. Telefon / WhatsApp","Phone / WhatsApp")+'</label><input id="pphone" value="'+esc(f.phone)+'" required></div><div class="field"><label>Email</label><input value="'+esc(f.email||user)+'" disabled></div><div class="field full"><label>'+T("Lokasi","Location")+'</label><input id="plocation" value="'+esc(f.location||"")+'" placeholder="Sarawak" required></div><div class="full actions"><button class="btn primary">'+T("Simpan","Save")+'</button></div></form></section>'}
function admin(){var q=window.bbq||"",filter=window.bbf||"";var list=products.filter(function(p){return (!filter||p.status===filter)&&[p.product,p.category,p.farmerName,p.phone,p.location,p.status].join(" ").toLowerCase().indexOf(q.toLowerCase())>=0});var total=products.reduce(function(a,p){return a+Number(p.purchasePrice||0)*Number(p.qty||0)},0);return header()+'<main class="container"><div class="toolbar"><div><span class="tag">🔐 '+T("Pengurus BorneoBasket","BorneoBasket Operator")+'</span><h1 style="margin:9px 0 4px">'+T("Papan Pemuka","Dashboard")+'</h1><span class="muted">'+T("Semak hasil petani, tetapkan harga belian dan urus kutipan.","Review farmer submissions, set purchase prices and manage collection.")+'</span></div><button class="btn secondary" onclick="BB.logout()">'+T("Log Keluar","Log Out")+'</button></div><section class="stats"><div class="stat"><div class="muted">'+T("Hasil Baharu","New Produce")+'</div><div class="num">'+products.filter(function(p){return p.status==="New"}).length+'</div></div><div class="stat"><div class="muted">'+T("Petani","Farmers")+'</div><div class="num">'+farmers.length+'</div></div><div class="stat"><div class="muted">'+T("Nilai Pembelian","Purchase Value")+'</div><div class="num">RM '+total.toFixed(2)+'</div></div></section><div class="toolbar"><input class="search" style="max-width:500px" placeholder="'+T("Cari petani, hasil atau lokasi","Search farmer, produce or location")+'" value="'+esc(q)+'" oninput="BB.search(this.value)"><select class="search" style="max-width:220px" onchange="BB.filter(this.value)"><option value="">'+T("Semua Status","All Statuses")+'</option><option value="New">'+T("Baharu","New")+'</option><option value="Contacted">'+T("Sudah Dihubungi","Contacted")+'</option><option value="Collection Arranged">'+T("Kutipan Dijadualkan","Collection Arranged")+'</option><option value="Collected">'+T("Sudah Dikumpul","Collected")+'</option><option value="Completed">'+T("Selesai","Completed")+'</option><option value="Rejected">'+T("Ditolak","Rejected")+'</option></select></div><div class="list">'+(list.map(adminItem).join("")||'<div class="card empty">'+T("Tiada rekod.","No records.")+'</div>')+'</div></main>'}
function adminItem(p){var buttons="";if(p.status==="New")buttons='<button class="btn primary" onclick="BB.setStatus('+p.id+',\'Contacted\')">'+T("Hubungi / Terima","Contact / Accept")+'</button><button class="btn danger" onclick="BB.setStatus('+p.id+',\'Rejected\')">'+T("Tolak","Reject")+'</button>';if(p.status==="Contacted")buttons='<button class="btn secondary" onclick="BB.setStatus('+p.id+',\'Collection Arranged\')">'+T("Atur Kutipan","Arrange Collection")+'</button>';if(p.status==="Collection Arranged")buttons='<button class="btn secondary" onclick="BB.setStatus('+p.id+',\'Collected\')">'+T("Tanda Sudah Dikumpul","Mark Collected")+'</button>';if(p.status==="Collected")buttons='<button class="btn primary" onclick="BB.setStatus('+p.id+',\'Completed\')">'+T("Selesaikan","Complete")+'</button>';return '<div class="item"><div class="photo">'+icon(p)+'</div><div><h3>'+esc(p.product)+'</h3><div class="meta">👤 '+esc(p.farmerName)+' · 📱 '+esc(p.phone)+'</div><div class="meta">📍 '+esc(p.location)+' · ⚖️ '+esc(p.qty)+' '+esc(p.unit)+' · 💰 RM '+Number(p.price||0).toFixed(2)+'/'+esc(p.unit)+'</div><div class="meta">📅 '+esc(p.harvest)+' '+(p.collectionDate?"· 🚚 "+esc(p.collectionDate):"")+(p.purchasePrice?" · 🧾 RM "+Number(p.purchasePrice).toFixed(2)+"/"+esc(p.unit):"")+'</div><div style="margin-top:7px">'+status(p.status)+'</div><div class="actions" style="justify-content:flex-start;margin-top:9px">'+buttons+(p.status!=="New"&&p.status!=="Rejected"?'<button class="btn outline" onclick="BB.purchase('+p.id+')">'+T("Harga Belian / Nota","Purchase Price / Notes")+'</button>':"")+'</div></div></div>'}
window.BB={
 lang:function(x){lang=x;save();render()},
 role:function(){role=role==="admin"?"farmer":"admin";render()},
 login:function(e){e.preventDefault();user=document.getElementById("email").value.trim().toLowerCase();if(role==="admin"&&user!=="admin@borneo.com"){alert("Use admin@borneo.com for the operator demo.");return}if(role==="farmer"&&!farmers.some(function(f){return f.email===user})){farmers.push({email:user,name:user.split("@")[0],phone:"",location:"Sarawak"});save()}render()},
 logout:function(){user=null;role="farmer";page="dashboard";render()},
 page:function(p){page=p;render()},
 reset:function(){localStorage.removeItem("bbDemoState");location.reload()},
 add:function(e){e.preventDefault();var f=farmers.filter(function(x){return x.email===user})[0]||{};var file=document.getElementById("photo").files[0];var finish=function(photo){products.unshift({id:Date.now(),farmerEmail:user,farmerName:f.name||user,phone:f.phone||"",product:document.getElementById("product").value,category:document.getElementById("category").value,photo:photo||"",qty:document.getElementById("qty").value,unit:document.getElementById("unit").value,price:document.getElementById("price").value,harvest:document.getElementById("harvest").value,location:document.getElementById("location").value,desc:document.getElementById("desc").value,status:"New",purchasePrice:""});save();page="mine";render()};if(file){var r=new FileReader();r.onload=function(){finish(r.result)};r.readAsDataURL(file)}else finish("")},
 profile:function(e){e.preventDefault();var f=farmers.filter(function(x){return x.email===user})[0];if(!f){f={email:user};farmers.push(f)}f.name=document.getElementById("pname").value;f.phone=document.getElementById("pphone").value;f.location=document.getElementById("plocation").value;save();render()},
 setStatus:function(id,s){var p=products.filter(function(x){return x.id===id})[0];if(p){p.status=s;save();render()}},
 purchase:function(id){var p=products.filter(function(x){return x.id===id})[0];if(!p)return;var v=prompt(T("Masukkan harga belian BorneoBasket (RM/unit):","Enter BorneoBasket purchase price (RM/unit):"),p.purchasePrice||p.price);if(v===null)return;p.purchasePrice=v;var d=prompt(T("Tarikh kutipan (contoh 2026-09-22):","Collection date (e.g. 2026-09-22):"),p.collectionDate||"");if(d!==null)p.collectionDate=d;save();render()},
 search:function(v){window.bbq=v;render()},
 filter:function(v){window.bbf=v;render()}

load();render();
